<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="620" viewBox="0 0 1800 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L11,6 z" fill="#1f2937"/>
    </marker>
    <marker id="arHit" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L11,6 z" fill="#065f46"/>
    </marker>
    <marker id="arMiss" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L11,6 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1800" height="620" fill="#ffffff"/>

  <!-- ===== LANE 1: Async pre-speculation ===== -->
  <text x="30" y="26" font-size="18" font-weight="700" fill="#111827" letter-spacing="0.6">
    Async pre-speculation lane (in parallel with verifier)
  </text>
  <rect x="20" y="40" width="1320" height="240" rx="0" fill="none" stroke="#9ca3af" stroke-dasharray="6,4" stroke-width="1.3"/>

  <!-- Outcome predictor -->
  <rect x="60" y="100" width="280" height="140" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="200" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Outcome predictor</text>
  <text x="200" y="178" text-anchor="middle" font-size="17" fill="#374151">top-F outcomes</text>
  <text x="200" y="210" text-anchor="middle" font-size="18" font-style="italic" fill="#374151">{(k_i, t*_i)}, i = 1..F</text>

  <!-- Arrow Predictor &gt; Speculator -->
  <path d="M 340 170 L 440 170" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Primary speculator: this work highlight -->
  <rect x="440" y="100" width="320" height="140" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="600" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Primary speculator</text>
  <text x="600" y="173" text-anchor="middle" font-size="16" fill="#1e40af">pre-speculate F branches in parallel</text>
  <text x="600" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">backend: AR &#183; DFlash &#183; DDTree</text>

  <!-- THIS WORK chip -->
  <rect x="520" y="68" width="160" height="24" rx="3" fill="#1d4ed8"/>
  <text x="600" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.8">THIS WORK</text>

  <!-- Arrow Speculator &gt; Cache -->
  <path d="M 760 170 L 860 170" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Speculation cache -->
  <rect x="860" y="100" width="320" height="140" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="1020" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Speculation cache</text>
  <text x="1020" y="175" text-anchor="middle" font-size="17" fill="#374151">F pre-drafted continuations</text>
  <text x="1020" y="208" text-anchor="middle" font-size="15" font-style="italic" fill="#374151">indexed by predicted (k_i, t*_i)</text>

  <!-- ===== LANE 2: Synchronous verifier ===== -->
  <text x="30" y="316" font-size="18" font-weight="700" fill="#111827" letter-spacing="0.6">
    Synchronous verifier lane
  </text>
  <rect x="20" y="330" width="1320" height="240" rx="0" fill="none" stroke="#9ca3af" stroke-dasharray="6,4" stroke-width="1.3"/>

  <!-- Prompt -->
  <rect x="60" y="390" width="240" height="140" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="180" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Prompt + prefix</text>
  <text x="180" y="478" text-anchor="middle" font-size="20" font-style="italic" fill="#374151">x_t</text>

  <!-- Arrow Prompt &gt; Verifier -->
  <path d="M 300 460 L 440 460" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Verifier -->
  <rect x="440" y="390" width="320" height="140" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="600" y="432" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Verifier (Qwen3-8B)</text>
  <text x="600" y="462" text-anchor="middle" font-size="16" fill="#374151">parallel-verify a draft prefix</text>
  <text x="600" y="495" text-anchor="middle" font-size="16" font-style="italic" fill="#374151">emits actual outcome (k, t*)</text>

  <!-- Arrow Verifier &gt; Cache lookup -->
  <path d="M 760 460 L 1180 460" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="970" y="447" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">actual (k, t*)</text>

  <!-- Cache contents dashed -->
  <path d="M 1180 240 C 1240 280, 1300 340, 1340 400"
        stroke="#1f2937" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)"/>
  <text x="1268" y="318" font-size="13" font-style="italic" fill="#4b5563">cache</text>
  <text x="1268" y="335" font-size="13" font-style="italic" fill="#4b5563">contents</text>

  <!-- Cache lookup -->
  <rect x="1340" y="410" width="170" height="100" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="1425" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Cache</text>
  <text x="1425" y="476" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">lookup</text>

  <!-- Hit branch up -->
  <path d="M 1510 432 L 1620 332" stroke="#065f46" stroke-width="2.5" fill="none" marker-end="url(#arHit)"/>
  <text x="1525" y="368" font-size="17" font-weight="700" fill="#065f46">hit</text>

  <rect x="1620" y="280" width="160" height="80" rx="6" fill="#ecfdf5" stroke="#065f46" stroke-width="1.8"/>
  <text x="1700" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">Reuse cached</text>
  <text x="1700" y="339" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">continuation</text>

  <!-- Miss branch down -->
  <path d="M 1510 488 L 1620 545" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arMiss)"/>
  <text x="1525" y="528" font-size="17" font-weight="700" fill="#6b7280">miss</text>

  <rect x="1620" y="520" width="160" height="80" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.8"/>
  <text x="1700" y="552" text-anchor="middle" font-size="17" font-weight="700" fill="#374151">Backup speculator</text>
  <text x="1700" y="578" text-anchor="middle" font-size="14" font-style="italic" fill="#4b5563">synchronous fallback</text>
</svg>
